<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terra e Lua em Órbita - CSS</title>
  <style>
    /* Cenário espacial */
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #030611;
      overflow: hidden;
    }

    /* Fundo de estrelas */
    body::before {
      content: '';
      position: absolute;
      width: 2px;
      height: 2px;
      background: transparent;
      box-shadow: 
        15vw 15vh #fff, 35vw 25vh rgba(255,255,255,0.6), 85vw 12vh #fff,
        8vw 75vh rgba(255,255,255,0.4), 22vw 88vh #fff, 70vw 82vh rgba(255,255,255,0.7),
        92vw 55vh #fff, 52vw 45vh rgba(255,255,255,0.5), 62vw 22vh #fff,
        12vw 42vh #fff, 42vw 72vh rgba(255,255,255,0.8), 82vw 88vh #fff;
      animation: piscar 1s infinite ease-in-out alternate;
    }

    /* O Planeta Terra */
    .terra {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      position: relative;
      
      /* Gradiente para simular oceanos e continentes simplificados */
      background: radial-gradient(circle at 30% 30%, #2b82c9 20%, #228b22 55%, #1a5380 90%);
      
      /* Sombra interna para atmosfera/3D e brilho azul sutil ao redor */
      box-shadow: 
        inset -20px -20px 40px rgba(0, 0, 0, 0.6),
        inset 10px 10px 25px rgba(255, 255, 255, 0.4),
        0 0 30px rgba(71, 162, 236, 0.5);
    }

    /* Linha e motor da órbita da Lua */
    .orbita-lua {
      position: absolute;
      width: 320px;
      height: 320px;
      border: 1px dashed rgba(255, 255, 255, 0.08); /* Linha sutil da órbita */
      border-radius: 50%;
      top: 50%;
      left: 50%;
      /* Centraliza o anel da órbita exatamente no meio da Terra */
      transform: translate(-50%, -50%); 
      
      /* Controla a rotação da lua */
      animation: rodar 16s infinite linear; 
    }

    /* Elemento da Lua */
    .lua {
      width: 40px;
      height: 40px;
      background-color: #f6ecce;
      border-radius: 50%;
      position: absolute;
      
      /* Posiciona a lua na linha do anel orbital */
      top: 50%;
      left: -20px; 
      transform: translateY(-50%);
      
      /* Sombras e textura 3D da lua */
      box-shadow: 
        inset -5px -5px 10px rgba(0, 0, 0, 0.3), 
        inset 5px 5px 10px rgba(255, 255, 255, 0.6),
        0 0 15px rgba(246, 236, 206, 0.4);
    }

    /* Crateras simplificadas da lua */
    .lua::before {
      content: '';
      position: absolute;
      top: 8px;
      left: 10px;
      width: 8px;
      height: 8px;
      background-color: rgba(0, 0, 0, 0.06);
      border-radius: 50%;
      box-shadow: 
        12px 14px 0 -2px rgba(0, 0, 0, 0.06),
        -4px 12px 0 0px rgba(0, 0, 0, 0.05),
        15px 2px 0 -1px rgba(0, 0, 0, 0.05);
    }

    /* Animação de rotação */
    @keyframes rodar {
      from {
        transform: translate(-50%, -50%) rotate(0deg);
      }
      to {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }

    /* Animação das estrelas */
    @keyframes piscar {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Centro do sistema -->
  <div class="terra">
    <!-- O anel orbital fica dentro/junto para manter o alinhamento centralizado -->
    <div class="orbita-lua">
      <div class="lua"></div>
    </div>
  </div>

</body>
</html>
