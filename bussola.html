<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Bússola no Navegador</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      background: #f0f0f0;
    }
#compass {
  width: 260px;
  height: 260px;
  border: 6px solid #333;
  border-radius: 50%;
  position: relative;
  background: radial-gradient(circle, #ffffff 0%, #e0e0e0 100%);
  box-shadow:
    inset 0 0 20px rgba(0,0,0,0.15),
    0 5px 20px rgba(0,0,0,0.25);
}

.rose {
  position: absolute;
  width: 100%;
  height: 100%;
  transition: transform 0.1s ease-out;
}

.dir {
  position: absolute;
  font-weight: bold;
  color: #222;
  transform: translate(-50%, -50%);
}

.north {
  top: 12px;
  left: 50%;
  color: #d60000;
  font-size: 28px;
}

.ne {
  top: 18%;
  left: 82%;
}

.east {
  top: 50%;
  left: 95%;
}

.se {
  top: 82%;
  left: 82%;
}

.south {
  top: 95%;
  left: 50%;
}

.sw {
  top: 82%;
  left: 18%;
}

.west {
  top: 50%;
  left: 5%;
}

.nw {
  top: 18%;
  left: 18%;
}

/* Grupo do ponteiro */
#needle {
  position: absolute;
  width: 100%;
  height: 100%;
}

/* Triângulo vermelho apontando para o norte */
.needle-north {
  position: absolute;
  left: 50%;
  top: 18px;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 14px solid transparent;
  border-right: 14px solid transparent;
  border-bottom: 105px solid #d60000;
}

/* Triângulo traseiro */
.needle-south {
  position: absolute;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 10px solid transparent;
  border-right: 10px solid transparent;
  border-top: 75px solid #444;
}

/* Centro */
.center-dot {
  position: absolute;
  width: 20px;
  height: 20px;
  background: #222;
  border: 4px solid white;
  border-radius: 50%;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 10px rgba(0,0,0,0.4);
}

    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      background-color: #007bff;
      color: white;
      border-radius: 4px;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #0056b3;
    }

    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }

    button.active {
      background-color: #d60000;
    }

    button.active:hover {
      background-color: #a00000;
    }

    #info {
      font-size: 18px;
      color: #333;
      min-height: 30px;
    }

    .status-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
      background-color: #ccc;
    }

    .status-indicator.active {
      background-color: #28a745;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.7);
      }
      50% {
        box-shadow: 0 0 0 8px rgba(40, 167, 69, 0);
      }
    }
  </style>
</head>
<body>

  <div id="compass">
  <div class="rose">
    <span class="dir north">N</span>
    <span class="dir ne">NE</span>
    <span class="dir east">L</span>
    <span class="dir se">SE</span>
    <span class="dir south">S</span>
    <span class="dir sw">SO</span>
    <span class="dir west">O</span>
    <span class="dir nw">NO</span>
  </div>

  <div id="needle">
    <div class="needle-north"></div>
    <div class="needle-south"></div>
    <div class="center-dot"></div>
  </div>
</div>
  
  <p id="info"><span class="status-indicator"></span>Clique no botão para ativar a bússola</p>
  <button id="enable">Ativar</button>

  <script>
    const rose = document.querySelector('.rose');
    const info = document.getElementById('info');
    const statusIndicator = document.querySelector('.status-indicator');
    const enableBtn = document.getElementById('enable');
    let currentHeading = 0;
    let isActive = false;
    let compassListener = null;

    enableBtn.addEventListener('click', () => {
      if (isActive) {
        stopCompass();
      } else {
        // Verifica suporte a DeviceOrientation
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission()
            .then(response => {
              if (response === 'granted') {
                startCompass();
              } else {
                info.innerHTML = '<span class="status-indicator"></span>Permissão negada.';
              }
            }).catch(error => {
              console.error('Erro ao solicitar permissão:', error);
              info.innerHTML = '<span class="status-indicator"></span>Erro ao solicitar permissão.';
            });
        } else if (typeof DeviceOrientationEvent !== 'undefined') {
          // Fallback para dispositivos que não requerem permissão
          startCompass();
        } else {
          info.innerHTML = '<span class="status-indicator"></span>Sensor de orientação não suportado neste dispositivo.';
          enableBtn.disabled = true;
        }
      }
    });

    function startCompass() {
      isActive = true;
      enableBtn.textContent = 'Desativar';
      enableBtn.classList.add('active');
      statusIndicator.classList.add('active');
      info.innerHTML = '<span class="status-indicator active"></span>Bússola ativa - Direção: 0°';
      
      // Define a função de listener para poder remover depois
      compassListener = (e) => {
        let alpha = e.alpha; // Rotação em torno do eixo Z (0-360°)
        
        if (alpha !== null && alpha !== undefined) {
          // O ponteiro fica fixo apontando para o norte
          // A rosa dos ventos rotaciona para que o "N" sempre aponte para o norte geográfico
          currentHeading = alpha;
          
          // Rotaciona a rosa dos ventos de forma inversa ao movimento do celular
          // Assim o ponteiro vermelho permanece sempre apontando para o norte
          rose.style.transform = `rotate(${-alpha}deg)`;
          info.innerHTML = `<span class="status-indicator active"></span>Bússola ativa - Direção: ${Math.round(alpha)}°`;
        } else {
          info.innerHTML = '<span class="status-indicator"></span>Sensor indisponível neste aparelho.';
        }
      };
      
      window.addEventListener('deviceorientation', compassListener, true);
    }

    function stopCompass() {
      isActive = false;
      enableBtn.textContent = 'Ativar';
      enableBtn.classList.remove('active');
      statusIndicator.classList.remove('active');
      
      // Remove o event listener
      if (compassListener) {
        window.removeEventListener('deviceorientation', compassListener, true);
        compassListener = null;
      }
      
      // Reseta a rosa dos ventos
      rose.style.transform = 'rotate(0deg)';
      info.innerHTML = '<span class="status-indicator"></span>Bússola desativada - Clique para ativar';
    }
  </script>
</body>
</html>
