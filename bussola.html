<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Bússola no Navegador</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      background: #f0f0f0;
    }
#compass {
  width: 260px;
  height: 260px;
  border: 6px solid #333;
  border-radius: 50%;
  position: relative;
  background: radial-gradient(circle, #ffffff 0%, #e0e0e0 100%);
  box-shadow:
    inset 0 0 20px rgba(0,0,0,0.15),
    0 5px 20px rgba(0,0,0,0.25);
  transition: transform 0.1s ease-out;
}

.rose {
  position: absolute;
  width: 100%;
  height: 100%;
}

.dir {
  position: absolute;
  font-weight: bold;
  color: #222;
  transform: translate(-50%, -50%);
}

.north {
  top: 12px;
  left: 50%;
  color: #d60000;
  font-size: 28px;
}

.ne {
  top: 18%;
  left: 82%;
}

.east {
  top: 50%;
  left: 95%;
}

.se {
  top: 82%;
  left: 82%;
}

.south {
  top: 95%;
  left: 50%;
}

.sw {
  top: 82%;
  left: 18%;
}

.west {
  top: 50%;
  left: 5%;
}

.nw {
  top: 18%;
  left: 18%;
}

/* Grupo do ponteiro */
#needle {
  position: absolute;
  width: 100%;
  height: 100%;
}

/* Triângulo vermelho apontando para o norte */
.needle-north {
  position: absolute;
  left: 50%;
  top: 18px;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 14px solid transparent;
  border-right: 14px solid transparent;
  border-bottom: 105px solid #d60000;
}

/* Triângulo traseiro */
.needle-south {
  position: absolute;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 10px solid transparent;
  border-right: 10px solid transparent;
  border-top: 75px solid #444;
}

/* Centro */
.center-dot {
  position: absolute;
  width: 20px;
  height: 20px;
  background: #222;
  border: 4px solid white;
  border-radius: 50%;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 10px rgba(0,0,0,0.4);
}
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div id="compass">
  <div class="rose">
    <span class="dir north">N</span>
    <span class="dir ne">NE</span>
    <span class="dir east">L</span>
    <span class="dir se">SE</span>
    <span class="dir south">S</span>
    <span class="dir sw">SO</span>
    <span class="dir west">O</span>
    <span class="dir nw">NO</span>
  </div>

  <div id="needle">
    <div class="needle-north"></div>
    <div class="needle-south"></div>
    <div class="center-dot"></div>
  </div>
</div>
  
  <p id="info">Clique no botão para ativar a bússola</p>
  <button id="enable">Ativar</button>

  <script>
    const compass = document.getElementById('compass');
    const info = document.getElementById('info');
    const enableBtn = document.getElementById('enable');

    enableBtn.addEventListener('click', () => {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(response => {
            if (response === 'granted') {
              startCompass();
            } else {
              info.innerText = 'Permissão negada.';
            }
          }).catch(console.error);
      } else {
        startCompass();
      }
    });

    function startCompass() {
      enableBtn.style.display = 'none';
      window.addEventListener('deviceorientation', (e) => {
        let alpha = e.alpha; // Direção apontada pelo aparelho
        if (alpha !== null) {
          compass.style.transform = `rotate(${-alpha}deg)`;
          info.innerText = `Direção: ${Math.round(alpha)}°`;
        } else {
          info.innerText = 'Sensor indisponível neste aparelho.';
        }
      }, true);
    }
  </script>
</body>
</html>
