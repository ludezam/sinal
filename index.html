    <div class="controls" role="toolbar" aria-label="Controles">
      <button class="btn" id="btn-wifi">WiFi (info disponível)</button>
      <button class="btn" id="btn-cell">Rede Celular (info disponível)</button>
      <button class="btn primary" id="btn-gps">GPS (Geolocation)</button>
    </div>
  </div>

  <div class="canvas-wrap">
    <canvas id="radar" width="680" height="680" aria-label="Gráfico radar de sinais"></canvas>
  </div>

  <div class="panel">
    <div class="col small" style="min-width:260px;">
      <label for="poll-url">URL para buscar dados POST (GET polling)</label>
      <input id="poll-url" type="text" placeholder="https://meu-backend.example/api/latest" />
      <div style="display:flex; gap:8px; margin-top:8px;">
        <button class="btn" id="btn-start-poll">Iniciar polling</button>
        <button class="btn" id="btn-stop-poll" disabled>Parar polling</button>
        <button class="btn" id="btn-fetch-now">Buscar agora</button>
      </div>

      <label style="margin-top:12px;">Importar dados POST manual (cole JSON abaixo)</label>
      <textarea id="post-json" placeholder='Cole um array JSON: [{"id":"x","label":"Hot A","strength":63}]'></textarea>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <button class="btn" id="btn-import">Importar JSON</button>
        <button class="btn" id="btn-clear-post">Limpar dados POST</button>
        <button class="btn" id="btn-download">Exportar merged JSON</button>
      </div>

      <div class="status" id="status">Pronto.</div>
      <div class="status" id="hint" style="margin-top:6px; font-size:12px;">
        Observação: para Geolocation no iPhone/Safari sirva via HTTPS e permita localização.
      </div>
    </div>

    <div class="col" style="flex:2;">
      <label>Resumo / Últimos dados recebidos</label>
      <div id="summary" style="min-height:160px; color:var(--muted); font-size:13px; white-space:pre-wrap;"></div>
    </div>
  </div>
</div>
